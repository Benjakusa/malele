[project]
name = "malele-backend"
version = "0.1.0"
description = "Malele backend — AI music creation platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "redis>=5.0",
    "celery>=5.4",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "static-ffmpeg>=3.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-postgresql>=6.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: provider contract tests",
    "e2e: live provider tests (requires LIVE_PROVIDER_TESTS=1)",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
